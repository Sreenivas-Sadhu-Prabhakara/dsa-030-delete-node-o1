<text x="56.0" y="189.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Trick: copy the successor's value into this node. Now the list reads 4,1,1,9 and the</text>
